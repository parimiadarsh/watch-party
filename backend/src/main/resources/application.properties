spring.application.name=watch-party-backend

# Optional local overrides (gitignored): backend/application-local.properties
spring.config.import=optional:file:./application-local.properties

# Google OAuth Web client ID (must match VITE_GOOGLE_CLIENT_ID)
watchparty.google.client-id=${GOOGLE_CLIENT_ID:}

# HMAC secret for session JWTs (min 32 bytes for HS256)
watchparty.jwt.secret=${JWT_SECRET:dev-only-change-me-32b-min________}

spring.datasource.url=jdbc:h2:file:./data/watchparty
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
