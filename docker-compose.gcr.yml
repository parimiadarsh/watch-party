# Pull all images from GCR — no local build.
#
# .env (repo root): GCP_PROJECT_ID, IMAGE_TAG, optional GCR_*_REPO names, JWT_SECRET, etc.
#
# Before pull (Windows):
#   $env:GCP_PROJECT_ID="project-332623"
#   .\scripts\auth-docker-gcr.ps1
#
#   docker compose -f docker-compose.gcr.yml pull
#   docker compose -f docker-compose.gcr.yml up -d
#
# Default image repos: watch-party-backend / watch-party-middleware / watch-party-frontend.
# If you tagged differently in GCR (e.g. watchparty-back), set GCR_*_REPO in .env.

services:
  backend:
    image: gcr.io/project-332623/watchparty-back:latest
    container_name: watch-party-backend
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars!!}
    volumes:
      - watchparty-data:/app/data
    expose:
      - "8080"
    networks:
      - watchparty

  middleware:
    image: gcr.io/project-332623/watchparty-mid:latest
    container_name: watch-party-middleware
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SPRING_BOOT_URL: http://backend:8080
      PORT: "3001"
    expose:
      - "3001"
    networks:
      - watchparty

  frontend:
    image: gcr.io/project-332623/watchparty-front:latest
    container_name: watch-party-frontend
    restart: unless-stopped
    depends_on:
      - middleware
    environment:
      BACKEND_URL: http://middleware:3001
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - watchparty

networks:
  watchparty:
    driver: bridge

volumes:
  watchparty-data: