# Production stack from GCR: backend, middleware, frontend, nginx.
#
#   docker compose -f docker-compose.gcr.yml pull
#   docker compose -f docker-compose.gcr.yml up -d
#
# Public entry: nginx on host :80 and :443 (config: nginx/default.conf).
# Copy the whole repo (including nginx/) to the VM. If nginx.conf was created as a
# directory by Docker, remove it: rm -rf nginx.conf
#   https://fermiwatch.duckdns.org  → 301  →  http://fermiwatch.duckdns.org
#   http://fermiwatch.duckdns.org   → proxy → frontend (internal :80)
#
# TLS certs on the VM (once): certbot certonly --standalone -d fermiwatch.duckdns.org
# Stop host nginx if installed so ports 80/443 are free: sudo systemctl stop nginx
#
# Open GCP firewall: tcp:80, tcp:443

services:
  backend:
    image: gcr.io/project-332623/watchparty-back:latest
    container_name: watch-party-backend
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars!!}
    volumes:
      - watchparty-data:/app/data
    expose:
      - "8080"
    networks:
      - watchparty

  middleware:
    image: gcr.io/project-332623/watchparty-mid:latest
    container_name: watch-party-middleware
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SPRING_BOOT_URL: http://backend:8080
      PORT: "3001"
    expose:
      - "3001"
    networks:
      - watchparty

  frontend:
    image: gcr.io/project-332623/watchparty-front:latest
    container_name: watch-party-frontend
    restart: unless-stopped
    depends_on:
      - middleware
    environment:
      BACKEND_URL: http://middleware:3001
    expose:
      - "80"
    networks:
      - watchparty

  nginx:
    image: nginx:1.27-alpine
    container_name: watch-party-nginx
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    networks:
      - watchparty

networks:
  watchparty:
    driver: bridge

volumes:
  watchparty-data:
