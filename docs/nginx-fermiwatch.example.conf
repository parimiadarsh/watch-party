# Copy to the VM:
#   sudo cp docs/nginx-fermiwatch.example.conf /etc/nginx/sites-available/fermiwatch
#   sudo sed -i "s|/home/YOUR_USER/watch-party|$(pwd)|g" /etc/nginx/sites-available/fermiwatch
#   sudo ln -sf /etc/nginx/sites-available/fermiwatch /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires: frontend built (npm run build), backend on 127.0.0.1:8080

server {
    listen 80;
    listen [::]:80;
    server_name fermiwatch.duckdns.org;

    root /home/YOUR_USER/watch-party/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
