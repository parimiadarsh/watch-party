# Edge nginx for fermiwatch.duckdns.org (docker-compose.gcr.yml service "nginx").
# DuckDNS / app traffic is HTTP only: HTTPS → redirect to HTTP, then proxy to frontend.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream watchparty_frontend {
    server frontend:80;
}

# HTTPS → http://fermiwatch.duckdns.org (same path)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fermiwatch.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/fermiwatch.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fermiwatch.duckdns.org/privkey.pem;

    return 301 http://$host$request_uri;
}

# HTTP — proxy to frontend container (SPA, /api, /ws)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fermiwatch.duckdns.org _;

    location / {
        proxy_pass http://watchparty_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 86400;
    }
}
